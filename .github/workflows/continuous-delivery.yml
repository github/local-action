name: Continuous Delivery

on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - bin/**/*
      - src/**/*
      - .node-version
      - package-lock.json
      - package.json
      - tsconfig.base.json
      - tsconfig.eslint.json
      - tsconfig.json
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    # Only run this job if one of the following is true:
    # - It was run manually.
    # - A PR was merged that was not from Dependabot or a fork.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        startsWith(github.head_ref, 'dependabot/') == false &&
        github.event.pull_request.head.repo.fork == false
      )

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-tags: true

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: npm
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org/

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Test
        id: test
        run: npm run ci-test

      - name: Publish
        id: publish
        run: |
          npm publish --ignore-scripts --access public

  release:
    name: Create Release
    runs-on: ubuntu-latest

    needs: publish

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-tags: true

      - name: Tag
        id: tag
        uses: issue-ops/semver@e58d2f490332e0310a78e9a0e935d8d6f898e9e3 # v3.0.0
        with:
          manifest-path: package.json
          workspace: ${{ github.workspace }}
          ref: main

      - name: Create Release
        id: release
        uses: issue-ops/releaser@41bcc03658669135298bb08b60f043f1e02bf10e # v3.0.0
        with:
          tag: v${{ steps.tag.outputs.version }}
