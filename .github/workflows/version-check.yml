name: Version Check

on:
  pull_request:
    branches:
      - main
    paths:
      - bin/**/*
      - src/**/*
      - .node-version
      - package-lock.json
      - package.json
      - tsconfig.base.json
      - tsconfig.eslint.json
      - tsconfig.json

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  check-version:
    name: Version Check
    runs-on: ubuntu-latest

    if: ${{ startsWith(github.head_ref, 'dependabot/') == false }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Check Version
        id: check-version
        uses: issue-ops/semver@e58d2f490332e0310a78e9a0e935d8d6f898e9e3 # v3.0.0
        with:
          check-only: true
          comment: true
          manifest-path: package.json
          workspace: ${{ github.workspace }}
